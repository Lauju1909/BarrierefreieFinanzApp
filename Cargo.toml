[package]
name = "haushaltsbuch"
version = "6.9.68"
edition = "2021"
authors = ["Lauju1909"]
description = "Barrierefreies Haushaltsbuch & Tresor-Server (100% Native Rust Edition)"

[[bin]]
name = "Haushaltsbuch"
path = "src/main.rs"

[[bin]]
name = "Feedback_Zentrale"
path = "src/bin/feedback_zentrale.rs"

[[bin]]
name = "Kategorie_Zentrale"
path = "src/bin/kategorie_zentrale.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
